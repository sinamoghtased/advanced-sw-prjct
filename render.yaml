# Render Blueprint for the Quickdex backend. Deploy via the Render dashboard:
# New + -> Blueprint -> select this repo. See search-engine/backend/README.md#deploying.
services:
  - type: web
    name: quickdex-backend
    runtime: docker
    rootDir: search-engine/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # The admin key for deleting pages and setting bids. Render asks for the value when the
      # Blueprint is first applied; it is never stored in git. Without it the server is open.
      - key: QUICKDEX_ADMIN_KEY
        sync: false
